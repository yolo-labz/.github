<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160" role="img" aria-labelledby="t d">
  <title id="t">yolo-labz mascot — the programming gremlin, hero</title>
  <desc id="d">A green gremlin crouched behind a keyboard, huge pointed ears, mischievous slanted brows, a wide jagged fang grin, mauve code brackets rising from its clawed hands. The signature pose: the gremlin programming.</desc>
  <!--
    yolo-labz mascot · HERO — "the gremlin programming" (v2)
    The org's mascot (Pedro, 23/09: "the mascot for the yolo labz is the gremlin
    programming"). Construction spec: gremlin-model-sheet.svg.
    Palette: skin green (character, never recolour) · mauve = produced by the
    gremlin (code brackets + sparks) · pale = teeth/eyes/claws · dark = mouth/kbd
  -->
  <style>
    .skin  { fill: #a6e3a1; stroke: #a6e3a1; stroke-linejoin: round; stroke-linecap: round; }
    .pale  { fill: #cdd6f4; stroke: #cdd6f4; stroke-linejoin: round; stroke-linecap: round; }
    .dark  { fill: #181825; }
    .node  { fill: #cba6f7; }
    .code  { fill: none; stroke: #cba6f7; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .limb  { fill: none; stroke: #a6e3a1; stroke-width: 12; stroke-linecap: round; }
    .key   { fill: #45475a; }
    @media (prefers-color-scheme: light) {
      .skin { fill: #40a02b; stroke: #40a02b; }
      .pale { fill: #eff1f5; stroke: #eff1f5; }
      .dark { fill: #dce0e8; }
      .node { fill: #8839ef; }
      .code { stroke: #8839ef; }
      .limb { stroke: #40a02b; }
      .key  { fill: #9ca0b0; }
    }
  </style>
