<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="t d">
  <title id="t">yolo-labz mascot — working</title>
  <desc id="d">Songbird on the line, beak open, a mauve output line leaving the beak. The running state: a daemon is doing its job and the output is flowing.</desc>
  <!--
    yolo-labz mascot · state: working / running
    "The voice line as the animated mark": the one gesture of the family brand
    is a line leaving the open beak. Here it is the daemon's output — the log
    line, the reply, the send. Mauve means produced-by-the-bird, never chrome.
  -->
  <style>
    .form { fill: #cdd6f4; stroke: #cdd6f4; stroke-width: 6; stroke-linejoin: round; }
    .ink  { fill: none; stroke: #cdd6f4; stroke-width: 5; stroke-linecap: round; }
    .sub  { fill: none; stroke: #a6adc8; stroke-width: 4; stroke-linecap: round; }
    .voice{ fill: none; stroke: #cba6f7; stroke-width: 4; stroke-linecap: round; }
    .node { fill: #cba6f7; }
    @media (prefers-color-scheme: light) {
      .form { fill: #4c4f69; stroke: #4c4f69; }
      .ink  { stroke: #4c4f69; }
      .sub  { stroke: #7c7f93; }
      .voice{ stroke: #8839ef; }
      .node { fill: #8839ef; }
    }
  </style>
  <path class="sub" d="M18 104 H110" opacity="0.55"/>
  <path class="form" d="M38 56 L 6 46 L 12 72 Z"/>
  <ellipse class="form" cx="58" cy="66" rx="25" ry="20" transform="rotate(-16 58 66)"/>
  <circle class="form" cx="86" cy="44" r="14.5"/>
  <!-- beak open: upper + lower mandible -->
  <path class="form" d="M98 34 L 118 40 L 99 44 Z"/>
  <path class="form" d="M99 48 L 116 54 L 97 56 Z"/>
  <circle class="node" cx="90" cy="40" r="3.6"/>
  <!-- the output line: leaves the open beak and thins out (family motif) -->
  <path class="voice" d="M120 44 c 4 -4 6 2 8 -2"/>
  <path class="voice" d="M121 52 c 4 -3 6 1 7 -1" opacity="0.6"/>
  <path class="ink" d="M52 85 L 50 102 M64 86 L 66 102"/>
</svg>
