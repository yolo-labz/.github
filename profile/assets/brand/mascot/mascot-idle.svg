<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="t d">
  <title id="t">yolo-labz mascot — idle</title>
  <desc id="d">Geometric songbird perched on the line, beak closed, mauve node eye. The ready state: the system is up and listening on its socket.</desc>
  <!--
    yolo-labz mascot · state: idle / ready
    Family grammar (per the bird-motif canon):
      - the bird perches on THE LINE (the interface: socket, pipe, log)
      - the single mauve node is the eye — the same node that sits at the YL
        monogram's fork. Exactly one mauve element per state unless the bird is
        producing output (then the output line is also mauve = "spoken").
      - forms are stroke-6 round joins filled with the same ink, so the
        silhouette survives 32px the way the aferidor mark does.
    Theme-adaptive: dark (Mocha) by default, Latte under prefers-color-scheme.
  -->
  <style>
    .form { fill: #cdd6f4; stroke: #cdd6f4; stroke-width: 6; stroke-linejoin: round; }
    .ink  { fill: none; stroke: #cdd6f4; stroke-width: 5; stroke-linecap: round; }
    .sub  { fill: none; stroke: #a6adc8; stroke-width: 4; stroke-linecap: round; }
    .node { fill: #cba6f7; }
    @media (prefers-color-scheme: light) {
      .form { fill: #4c4f69; stroke: #4c4f69; }
      .ink  { stroke: #4c4f69; }
      .sub  { stroke: #7c7f93; }
      .node { fill: #8839ef; }
    }
  </style>
  <!-- the line: the interface the bird sits on -->
  <path class="sub" d="M18 104 H110" opacity="0.55"/>
  <!-- tail -->
  <path class="form" d="M38 56 L 6 46 L 12 72 Z"/>
  <!-- body -->
  <ellipse class="form" cx="58" cy="66" rx="25" ry="20" transform="rotate(-16 58 66)"/>
  <!-- head -->
  <circle class="form" cx="86" cy="44" r="14.5"/>
  <!-- beak (closed) -->
  <path class="form" d="M98 38 L 116 45 L 98 53 Z"/>
  <!-- eye = the node -->
  <circle class="node" cx="90" cy="41" r="3.6"/>
  <!-- legs to the line -->
  <path class="ink" d="M52 85 L 50 102 M64 86 L 66 102"/>
</svg>
