<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="t d">
  <title id="t">yolo-labz mascot — gremlin paused</title>
  <desc id="d">The programming gremlin with its head turned over the shoulder toward two faint incoming arcs, one claw raised. Paused state: holding for input, nothing produced.</desc>
  <!--
    state: paused / waiting for input · head mirrored (scale(-0.55,0.55)) to
    face the incoming signal. No mauve: nothing is produced while holding.
  -->
  <style>
    .skin { fill: #a6e3a1; stroke: #a6e3a1; stroke-linejoin: round; stroke-linecap: round; }
    .pale { fill: #cdd6f4; stroke: #cdd6f4; stroke-linejoin: round; stroke-linecap: round; }
    .dark { fill: #181825; }
    .node { fill: #cba6f7; }
    .limb { fill: none; stroke: #a6e3a1; stroke-linecap: round; }
    .sub  { fill: none; stroke: #a6adc8; stroke-width: 4; stroke-linecap: round; }
    @media (prefers-color-scheme: light) {
      .skin { fill: #40a02b; stroke: #40a02b; }
      .pale { fill: #eff1f5; stroke: #eff1f5; }
      .dark { fill: #dce0e8; }
      .node { fill: #8839ef; }
      .limb { stroke: #40a02b; }
      .sub  { stroke: #7c7f93; }
    }
  </style>
  <path class="sub" d="M 14 112 H 114" opacity="0.55"/>
