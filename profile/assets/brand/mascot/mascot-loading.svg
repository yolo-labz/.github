<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="t d">
  <title id="t">yolo-labz mascot — loading</title>
  <desc id="d">Songbird lifting off a dashed line with wings half-spread in a V — one large sweep left, one smaller sweep right — and motion ticks trailing. The loading state: warming up.</desc>
  <!--
    yolo-labz mascot · state: loading / warming up
    The v1 wings were two parallel leaves and read as rabbit ears. The fix:
    crescent wings at clearly different scales and angles (near wing sweeps
    up-left large, far wing up-right small), so the silhouette is a bird in
    flight, not a head with ears. Motion is ticks (flow), never bounce.
    No mauve: nothing has been produced yet.
  -->
  <style>
    .form { fill: #cdd6f4; stroke: #cdd6f4; stroke-width: 6; stroke-linejoin: round; }
    .ink  { fill: none; stroke: #cdd6f4; stroke-width: 5; stroke-linecap: round; }
    .sub  { fill: none; stroke: #a6adc8; stroke-width: 4; stroke-linecap: round; }
    .node { fill: #cba6f7; }
    @media (prefers-color-scheme: light) {
      .form { fill: #4c4f69; stroke: #4c4f69; }
      .ink  { stroke: #4c4f69; }
      .sub  { stroke: #7c7f93; }
      .node { fill: #8839ef; }
    }
  </style>
  <!-- the line: dashed where the bird just left it -->
  <path class="sub" d="M18 112 H58" opacity="0.55" stroke-dasharray="2 7"/>
  <path class="sub" d="M84 112 H110" opacity="0.55" stroke-dasharray="2 7"/>
  <!-- far wing: small sweep up-right -->
  <path class="form" d="M70 52 C 80 38 94 26 112 20 C 110 40 96 54 80 58 Z"/>
  <!-- body, climbing -->
  <ellipse class="form" cx="58" cy="66" rx="24" ry="18" transform="rotate(-22 58 66)"/>
  <!-- tail, trailing down-left -->
  <path class="form" d="M38 74 L 8 90 L 22 62 Z"/>
  <!-- near wing: large crescent sweep up-left -->
  <path class="form" d="M54 58 C 30 52 16 34 12 8 C 34 20 50 38 56 56 Z"/>
  <!-- head + closed beak -->
  <circle class="form" cx="88" cy="48" r="13.5"/>
  <path class="form" d="M100 42 L 118 49 L 100 56 Z"/>
  <circle class="node" cx="92" cy="45" r="3.6"/>
  <!-- motion ticks (flow, not delight) -->
  <path class="sub" d="M2 34 H18 M0 48 H12 M2 62 H14" opacity="0.6"/>
  <!-- tucked legs -->
  <path class="ink" d="M56 82 L 62 90 M68 78 L 74 85" stroke-width="4"/>
</svg>
