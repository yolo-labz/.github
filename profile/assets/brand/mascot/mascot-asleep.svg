<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="t d">
  <title id="t">yolo-labz mascot — asleep</title>
  <desc id="d">Songbird hunched on the line with its head tucked, eye closed, a thin crescent moon overhead. The idle-timed-out state: night mode.</desc>
  <!--
    yolo-labz mascot · state: asleep / night
    Head tucked into the body (no neck gap), eye node dark — the one state with
    no mauve at all: nothing is running. Crescent moon is sub, not accent.
  -->
  <style>
    .form { fill: #cdd6f4; stroke: #cdd6f4; stroke-width: 6; stroke-linejoin: round; }
    .ink  { fill: none; stroke: #cdd6f4; stroke-width: 5; stroke-linecap: round; }
    .sub  { fill: none; stroke: #a6adc8; stroke-width: 4; stroke-linecap: round; }
    @media (prefers-color-scheme: light) {
      .form { fill: #4c4f69; stroke: #4c4f69; }
      .ink  { stroke: #4c4f69; }
      .sub  { stroke: #7c7f93; }
    }
  </style>
  <path class="sub" d="M18 104 H110" opacity="0.55"/>
  <!-- moon: thin crescent, sub colour -->
  <path class="sub" d="M34 20 a 11 11 0 1 0 12 17 a 13 13 0 0 1 -12 -17 z" stroke-width="3"/>
  <!-- hunched body: wider, lower, head merged into the mass -->
  <path class="form" d="M30 84 C 24 62 40 48 62 48 C 84 48 100 62 98 82 C 84 92 44 92 30 84 Z"/>
  <!-- tail, flat along the line -->
  <path class="form" d="M32 78 L 4 74 L 8 88 Z"/>
  <!-- tucked head bump + beak pointing down-line -->
  <circle class="form" cx="84" cy="58" r="13"/>
  <path class="form" d="M96 54 L 114 58 L 96 64 Z"/>
  <!-- closed eye: a lid arc, no node -->
  <path class="sub" d="M82 54 a 5 5 0 0 1 9 2" stroke-width="3.5"/>
</svg>
