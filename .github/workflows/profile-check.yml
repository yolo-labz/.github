name: profile-check

on:
  pull_request:
  workflow_dispatch:

permissions: {}

# Opt into Node.js 24 for JavaScript actions ahead of the June 2026 default
# switch. Mirrors the org's other repositories.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  profile-check:
    name: Executable brand/profile gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # contents: read — checkout and the GitHub REST link probes. No write.
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checker unit tests
        run: python3 -m unittest -v

      - name: Brand/profile gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check-profile.py --repo .
